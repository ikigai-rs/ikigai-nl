[package]
name = "ikigai-nl"
version = "0.2.1"
edition = "2021"
# The toolchain the shared CI's msrv job builds and tests on: the line the ecosystem's
# other declared crates hold. MEASURED, not assumed: `cargo +1.89 clippy --all-targets`
# and `cargo +1.89 test` pass over this crate and its dev-dependencies before every push
# (the gates run both).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Natural language to ikigai: `urn:nl:grounding`, what an LLM drafter may know (the actions, the vocabulary, each readable graph's shape, worked examples), as data, under the caller's capability. Bounded, cited by content digest, cached per capability."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-nl"
homepage = "https://github.com/ikigai-rs/ikigai-nl"
readme = "README.md"
keywords = ["ikigai", "roc", "llm", "grounding", "module"]
categories = ["development-tools"]

[dependencies]
# The published kernel. 0.1.91 is the TRUE floor: an action's two identities,
# `match_iri` (the manifold row's subject) and `ActionSpec::contract_iri` (the catalog's
# content-addressed contract node), exist only from it (ledger #948, #1034); the other
# APIs used here (`Invocation::fan_out`, `UriTemplate`, `Description`'s serde form) are
# older. ⚠ `"0.1.91"` is a RANGE, `<0.2.0`: when core reaches 0.2 this line must move or
# the crate freezes out of it.
ikigai-core = "0.1.91"
# `to_turtle` renders each action exactly as the catalog does (same IRIs, same `ik:`
# terms), `VOCAB_IRI` is where the vocabulary is bound, and `NS` is the namespace of every
# term the grounding and a draft's provenance state that no other vocabulary has. 0.1.91 is
# the TRUE floor: from it `to_turtle` names the contract node by core's content-addressed
# IRI, and `ik:contract` (match to contract) is defined; `ik:Grounding` and the rest of
# this crate's terms arrived in 0.1.88 (ledger #974). ⚠ `"0.1.91"` is `<0.2.0`.
ikigai-vocab = "0.1.91"
# `Endpoint::invoke` is `async_trait`, and the grounding endpoint carries its config.
async-trait = "0.1"
# The JSON face, and reading the JSON faces of what it composes (descriptions, SPARQL
# results, the script catalog).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The grounding's identity: `sha256:` and hex, the ecosystem's tagged digest, so it joins
# script versions and log hashes in a query instead of colliding with them. 0.11 is the line
# ikigai-script (below) takes, so the library's graph carries ONE sha2 instead of 0.10 beside
# 0.11 (ledger #1196); the API used here (`Sha256::digest`, iterating its bytes) is unchanged
# across the two, and 0.11's MSRV is 1.85. ⚠ `"0.11"` is `<0.12.0`.
sha2 = "0.11"
# RDF terms and Turtle, from the oxigraph project the store is built on: parsing the
# vocabulary, and serializing the Turtle face so nothing is escaped by hand. 0.3 / 0.2 are
# the lines oxigraph 0.5 uses, so a host linking ikigai-store carries one copy.
oxrdf = "0.3"
oxttl = "0.2"
# A draft is PARSED here, never evaluated: the check walks spargebra's algebra for the
# predicates and classes a query names and the triple patterns an empty preview is probed
# with, and writes the dry run's LIMIT into that algebra, never splicing text. 0.4.7 is the
# parser oxigraph 0.5.11 and ikigai-script use, so the text checked here and the text the
# store reads go through one grammar. ⚠ `"0.4.7"` is `<0.5.0`.
spargebra = "0.4.7"
# The script host, as a library: its OWN rules, never a copy of them (ledger #1244 retired
# the copies of its SPARQL analysis and limits). `sparql::analyze` and `sparql::bind` read a
# draft's form, parameters, dataset and DERIVED authority exactly as the host will when the
# draft is saved, and bind the preview's parameter defaults into the algebra; `limits` bounds
# the text before the parser sees it. "May this caller read script X?" is asked of
# `authority::holds`, never of `Capability::allows`: a grant names one script or a NAMESPACE
# of them (`urn:cap:script:read:team-*`), and an exclusion takes a script back out, so an
# exact match disagrees with the host both ways (ledger #1196). 0.3.0 is the TRUE floor:
# namespace grants and `holds` arrived there (ledger #1174), and its `sparql.rs` and
# `limits.rs` are byte-identical in 0.3.0 and 0.3.2. Its own `ikigai-core` floor is 0.1.95,
# above the 0.1.91 this crate's APIs need, so a consumer resolves 0.1.95 either way.
# ⚠ `"0.3.0"` is `<0.4.0`: move it when the script host moves.
ikigai-script = "0.3.0"

# oxrdf pulls getrandom 0.3 (through rand, for blank-node ids this crate never mints), and
# getrandom refuses to compile for wasm32-unknown-unknown until a backend is named. The
# feature alone suffices from getrandom 0.3.4 (older versions also wanted a
# `getrandom_backend` rustflag), so 0.3.4 is the floor; ikigai-log carries the same line.
# Unused at runtime: nothing here generates randomness.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[features]
# TEST-ONLY, and it reaches only a DEV-dependency: the library has no oxigraph in it at all
# (`cargo tree -e normal -i oxigraph` is empty), so turning it on gives a consumer nothing.
# It compiles oxigraph's HTTP client into the TEST graph, which is what a host gets when another
# crate in its graph enables `oxigraph/http-client` (rudof_rdf does, so every native host linking
# ikigai-shacl has it; ledger #1083, #1085). `tests/service_egress.rs` runs under it in CI's
# `features:` job and proves no door here makes the store fetch a `SERVICE` or `LOAD`.
http-client-probe = ["oxigraph/http-client"]

[dev-dependencies]
futures = "0.3"
# Only for `tests/service_egress.rs`: the control that a plain evaluator in the probe build
# really reaches a local stub, and the line `http-client-probe` turns the client on through.
# The store's own line, `0.5.1` (its security floor), so the two unify. ⚠ `<0.6.0`.
oxigraph = { version = "0.5.1", default-features = false }
# The module recipe as one test. 0.6.0 is the CURRENT definition of "done" (the newest on
# crates.io): it adds SPACE-NAME, and `tests/conformance.rs` declares `space(config)`
# host-named. Its own floor is ikigai-core 0.1.89, below this crate's 0.1.91, so the
# `[dependencies]` pin above stays the LIBRARY's true minimum and is not raised for the
# suite. ⚠ `"0.6.0"` is `<0.7.0`: raise it when conformance moves, or this crate keeps
# reporting green against an old rulebook.
ikigai-conformance = "0.6.0"
# The store the graphs part reads, in memory, as a host would mount it. 0.2.5 is where
# `urn:iki:store:graphs` and several-graph scoped reads arrive. 0.2.10 is the TRUE floor now:
# from it every door the dry run reaches refuses `SERVICE` before evaluation, and
# `ikigai_store::service`'s door checks exist, which `tests/service_egress.rs` uses as the
# oracle this crate's own refusal must cover (ledger #1085). On 0.2.7 the dry run's door
# fetched a `SERVICE` in a build with `oxigraph/http-client` on. ⚠ `"0.2.10"` is `<0.3.0`.
ikigai-store = "0.2.10"
